<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Bhishak · AI Advisor (DeepSeek + Fallback)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{background:#fffef7;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem 1rem 5.5rem}
    .app-container{max-width:500px;width:100%;background:#fff;border-radius:2.5rem;box-shadow:0 8px 20px rgba(180,130,20,0.08);padding:1.8rem 1.3rem;border:1px solid #ffe9a7}
    .brand{display:flex;align-items:center;gap:0.6rem;margin-bottom:1rem}
    .brand i{font-size:1.6rem;color:#d4a017}
    .brand h1{font-size:1.8rem;background:linear-gradient(to right,#c99a2b,#b47c2e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .chat-window{background:#fffef2;border-radius:1.5rem;padding:1rem;height:320px;overflow-y:auto;border:1px solid #f7e2a4;margin-bottom:0.8rem;font-size:0.9rem}
    .chat-row{margin-bottom:0.5rem; line-height:1.4}
    .input-group{display:flex;gap:0.5rem}
    input{flex:2;padding:0.9rem 1.2rem;border-radius:2rem;border:1px solid #f0d48a;background:#fffef7;outline:none}
    button{background:#f7d44a;border:none;color:#4a3b1f;font-weight:700;padding:0.8rem 1.2rem;border-radius:2.5rem;cursor:pointer;display:flex;align-items:center;gap:0.4rem;box-shadow:0 4px 8px rgba(230,170,20,0.25);border:1px solid #e6b422}
    button:disabled{opacity:0.6; cursor:not-allowed}
    .warning-note{color:#b45309;background:#fff3e0;border-radius:2rem;padding:0.5rem 1rem;font-size:0.8rem;margin-top:0.8rem;display:flex;align-items:center;gap:0.5rem}
    .fallback-notice{background:#fff6d5;color:#7a5c12;padding:0.4rem 1rem;border-radius:1rem;font-size:0.8rem;display:inline-block;margin-bottom:0.4rem}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fffef7;border-top:2px solid #fad87a;display:flex;justify-content:space-around;padding:0.7rem 0.5rem;box-shadow:0 -4px 12px rgba(230,180,20,0.12);max-width:500px;margin:0 auto;border-radius:2rem 2rem 0 0}
    .nav-item{display:flex;flex-direction:column;align-items:center;font-size:0.8rem;color:#8b7a4c;font-weight:600;text-decoration:none}
    .nav-item i{font-size:1.4rem;color:#b4943c}
    .nav-item.active{color:#b47c2e}
  </style>
</head>
<body>
<div class="app-container">
  <div class="brand">
    <a href="index.html"><i class="fas fa-arrow-left" style="color:#b47c2e;"></i></a>
    <h1>Bhishak AI</h1>
  </div>
  <div id="statusIndicator" class="fallback-notice" style="display:none;">
    <i class="fas fa-exclamation-triangle"></i> Using offline Ayurvedic knowledge (API unreachable).
  </div>
  <div class="chat-window" id="chatMessages">
    <div class="chat-row"><i class="fas fa-robot" style="color:#d4a017;"></i> <strong>Bhishak:</strong> Namaste! Ask about Ayurvedic remedies, precautions, or prevention. 🙏</div>
  </div>
  <div class="input-group">
    <input type="text" id="userInput" placeholder="e.g., natural cure for acidity?">
    <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
  </div>
  <!-- <div class="warning-note">
    <i class="fas fa-info-circle"></i> For critical situations, immediately consult a doctor.
  </div> -->
</div>
<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
  <a class="nav-item" href="remedies.html"><i class="fas fa-leaf"></i><span>Remedies</span></a>
  <a class="nav-item active" href="chatbot.html"><i class="fas fa-robot"></i><span>Bhishak AI</span></a>
  <a class="nav-item" href="contact.html"><i class="fas fa-envelope"></i><span>Contact</span></a>
</nav>
<script>
  const OPENROUTER_KEY = "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";
  const API_URL = "https://openrouter.ai/api/v1/chat/completions";

  const chatDiv = document.getElementById('chatMessages');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusIndicator = document.getElementById('statusIndicator');

  let conversationHistory = [];

  const SYSTEM_PROMPT = `You are Bhishak, a caring Ayurvedic advisor. Provide natural home remedies, ingredients (Tulsi, Turmeric, Ginger, etc.), preparation steps, precautions, and prevention tips. Always remind users to consult a doctor for serious symptoms. Keep answers concise, warm, and practical.`;

  function getLocalResponse(query) {
    const q = query.toLowerCase();
    if (q.includes('cold') || q.includes('cough')) return "Tulsi-ginger tea: Boil 5-6 Tulsi leaves + 1 inch crushed ginger in 2 cups water, reduce to half, add honey. Gargle with warm turmeric water. See a doctor if fever lasts >2 days.";
    if (q.includes('headache') || q.includes('stress')) return "Apply peppermint oil on temples. Drink Brahmi tea. Practice deep breathing. Persistent headaches need medical check.";
    if (q.includes('digestion') || q.includes('acidity') || q.includes('indigestion')) return "Chew fennel seeds after meals. Drink cumin-coriander water. Avoid spicy food. Consult doctor if pain is severe.";
    if (q.includes('joint') || q.includes('pain') || q.includes('inflammation')) return "Turmeric milk (½ tsp turmeric in warm milk) helps. Gentle yoga & warm oil massage. Always check with doctor before using herbs with blood thinners.";
    if (q.includes('immunity') || q.includes('prevention')) return "Daily: Chyawanprash, Tulsi drops, seasonal fruits. Maintain a healthy routine and proper sleep.";
    if (q.includes('emergency') || q.includes('critical') || q.includes('severe')) return "⚠️ Please go to the nearest hospital or call emergency services immediately. Do not rely only on home remedies.";
    return "Ayurveda suggests maintaining dosha balance. Tell me your symptoms more specifically, and I'll suggest a simple home remedy. Remember to consult a doctor for serious conditions.";
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'chat-row';
    if (role === 'user') {
      div.innerHTML = `<strong>👤 You:</strong> ${text}`;
    } else {
      div.innerHTML = `<strong><i class="fas fa-leaf" style="color:#7a5c12;"></i> Bhishak:</strong> ${text}`;
    }
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function showTyping() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'chat-row';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Bhishak is thinking...`;
    chatDiv.appendChild(typingDiv);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function fetchReply(userMessage) {
    conversationHistory.push({ role: "user", content: userMessage });
    if (conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${OPENROUTER_KEY}`,
        "HTTP-Referer": "https://bhishak.netlify.app",
        "X-Title": "Bhishak"
      },
      body: JSON.stringify({
        model: "google/gemini-2.0-flash-001",
        messages: [
          { role: "system", content: SYSTEM_PROMPT },
          ...conversationHistory
        ],
        max_tokens: 500,
        temperature: 0.7
      })
    });

    if (!response.ok) throw new Error(`API ${response.status}`);
    const data = await response.json();
    const reply = data.choices[0].message.content;
    conversationHistory.push({ role: "assistant", content: reply });
    return reply;
  }

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;

    input.disabled = true;
    sendBtn.disabled = true;
    addMessage('user', text);
    input.value = '';
    showTyping();

    let reply, apiSuccess = false;
    try {
      reply = await fetchReply(text);
      apiSuccess = true;
    } catch (err) {
      console.warn("API error, falling back:", err);
      reply = getLocalResponse(text);
      statusIndicator.style.display = 'inline-block';
    }

    removeTyping();
    if (apiSuccess) statusIndicator.style.display = 'none';
    addMessage('assistant', reply);
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
