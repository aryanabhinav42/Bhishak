<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Bhishak · 80+ Ayurvedic Remedies</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ========== EXACT SAME GLOBAL STYLES AS INDEX.HTML ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #fffef7;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem 1rem 5.5rem;
    }

    .app-container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      border-radius: 2.5rem;
      box-shadow: 0 8px 20px rgba(180, 130, 20, 0.08);
      padding: 1.8rem 1.3rem;
      border: 1px solid #ffe9a7;
    }

    /* ========== BRAND (copied from index.html) ========== */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1.2rem;
    }
    .brand i {
      font-size: 2.4rem;
      color: #d4a017;
      background: #fff6d5;
      padding: 0.5rem;
      border-radius: 50%;
    }
    .brand h1 {
      font-size: 2.3rem;
      font-weight: 700;
      background: linear-gradient(to right, #c99a2b, #b47c2e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ========== CARD (same as index.html) ========== */
    .card {
      background: #fffef5;
      border-radius: 1.8rem;
      padding: 1.3rem;
      box-shadow: 0 6px 14px rgba(200, 150, 30, 0.07);
      border: 1px solid #fae29c;
      margin-top: 0.8rem;
    }

    /* ========== REMEDY SPECIFIC ELEMENTS ========== */
    .search-box {
      width: 100%;
      padding: 0.9rem 1.3rem;
      border-radius: 2.5rem;
      border: 1px solid #f0d48a;
      background: #fffef7;
      font-size: 0.95rem;
      outline: none;
      color: #4a3b1f;
      margin-bottom: 0.5rem;
    }

    .remedy-card {
      background: #fffef5;
      border-radius: 1.8rem;
      padding: 1.2rem;
      box-shadow: 0 6px 14px rgba(200, 150, 30, 0.07);
      border: 1px solid #fae29c;
      margin-bottom: 0.8rem;
    }

    .remedy-title {
      font-weight: 700;
      color: #8b691b;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }

    .herb-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.5rem 0 0.6rem;
    }

    .herb-badge {
      background: #fef3c7;
      padding: 0.25rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #7a5c12;
      border: 1px solid #eecb6e;
    }

    .process {
      color: #4a3b1f;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .warning-note {
      color: #b45309;
      background: #fff3e0;
      border-radius: 2rem;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      font-weight: 500;
    }

    #noResults {
      text-align: center;
      padding: 2rem;
      color: #7a5c12;
      display: none;
      font-size: 0.95rem;
    }

    /* ========== BOTTOM NAV (identical to index.html) ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fffef7;
      border-top: 2px solid #fad87a;
      display: flex;
      justify-content: space-around;
      padding: 0.7rem 0.5rem;
      box-shadow: 0 -4px 12px rgba(230, 180, 20, 0.12);
      max-width: 500px;
      margin: 0 auto;
      border-radius: 2rem 2rem 0 0;
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.8rem;
      color: #8b7a4c;
      font-weight: 600;
      text-decoration: none;
    }

    .nav-item i {
      font-size: 1.4rem;
      color: #b4943c;
    }

    .nav-item.active {
      color: #b47c2e;
      transform: scale(1.05);
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .bottom-nav {
        padding-bottom: calc(0.7rem + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- BRAND (exactly like index.html) -->
    <div class="brand">
      <i class="fas fa-om"></i>
      <h1>Bhishak</h1>
    </div>

    <!-- SEARCH BOX -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search remedy, herb, or condition...">

    <!-- REMEDIES LIST -->
    <div id="remedyList"></div>
    <div id="noResults"><i class="fas fa-leaf"></i> No remedies found. Try a different keyword.</div>

    <!-- WARNING -->
    <div class="warning-note">
      <i class="fas fa-stethoscope"></i> For serious or persistent symptoms, always consult a doctor.
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
  <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
  <a class="nav-item active" href="remedies.html"><i class="fas fa-leaf"></i><span>Remedies</span></a>
  <a class="nav-item" href="chatbot.html"><i class="fas fa-robot"></i><span>Bhishak AI</span></a>
  <a class="nav-item" href="contact.html"><i class="fas fa-envelope"></i><span>Contact</span></a>
</nav>

      { issue:"Acne / Pimples", herbs:["Neem","Turmeric","Sandalwood"], process:"Apply paste of neem leaves + turmeric + sandalwood powder on pimples." },

      { issue:"Wrinkles", herbs:["Honey","Banana"], process:"Mash banana with honey, apply face mask for 15 min, rinse." },
      { issue:"Weight Loss", herbs:["Lemon","Honey","Warm water"], process:"Drink warm water with lemon + honey on empty stomach. Add a pinch of cinnamon." },

      { issue:"Diabetes (Support)", herbs:["Karela","Jamun seeds","Fenugreek"], process:"Drink karela juice or soak fenugreek seeds overnight and eat in the morning." },

      { issue:"Chickenpox (Symptom relief)", herbs:["Neem leaves","Oatmeal bath"], process:"Add neem leaves to bath water. Apply oatmeal paste to soothe itching." },

      { issue:"Malaria (Support)", herbs:["Giloy","Tulsi"], process:"Drink Giloy-Tulsi juice daily as supportive therapy alongside medical treatment." },
      { issue:"Dengue Recovery", herbs:["Papaya leaf juice","Giloy"], process:"Take 1 tsp papaya leaf juice (filtered) twice daily. Drink Giloy decoction." },

      { issue:"Hangover", herbs:["Lemon water","Honey","Ginger"], process:"Mix juice of 1 lemon + 1 tsp honey + pinch ginger in warm water." },
      { issue:"Morning Sickness", herbs:["Ginger candy","Lemon"], process:"Suck on ginger candy or sniff fresh lemon peel to reduce nausea." },
      { issue:"Piles / Hemorrhoids", herbs:["Radish juice","Triphala"], process:"Drink radish juice daily. Take Triphala at bedtime. Apply coconut oil locally." },
      { issue:"Fissure", herbs:["Ghee","Milk"], process:"Drink warm milk with 1 tsp ghee at bedtime. Eat fibre-rich diet." },
      { issue:"Fungal Infection", herbs:["Neem oil","Turmeric"], process:"Apply neem oil mixed with pinch of turmeric on affected skin twice a day." },
      { issue:"Ringworm", herbs:["Mustard seeds","Neem"], process:"Grind mustard seeds with water to paste, apply on ringworm. Wash with neem water." },
      { issue:"Scabies", herbs:["Neem leaves","Turmeric paste"], process:"Bath with neem water. Apply turmeric paste mixed with little mustard oil." },
      { issue:"Psoriasis (Mild)", herbs:["Aloe vera","Turmeric"], process:"Apply aloe vera gel mixed with turmeric. Drink turmeric milk." },
      { issue:"Eczema", herbs:["Coconut oil","Camphor"], process:"Mix a small pinch of camphor in coconut oil, apply gently on eczema." },
      { issue:"Hives / Urticaria", herbs:["Basil leaves","Sandalwood"], process:"Apply sandalwood paste on hives. Drink tulsi tea to calm reaction." },
      { issue:"Chicken Skin (Keratosis Pilaris)", herbs:["Coconut oil","Ubtan"], process:"Massage with coconut oil and scrub gently with chickpea flour (ubtan) paste." },
      { issue:"Cracked Heels", herbs:["Ghee","Beeswax"], process:"Apply a mixture of warm ghee and beeswax on heels, wear socks overnight." },
      { issue:"Athlete's Foot", herbs:["Tea tree oil","Neem"], process:"Soak feet in neem water. Apply diluted tea tree oil between toes." },
      { issue:"Body Odour", herbs:["Baking soda","Sandalwood"], process:"Apply a paste of sandalwood powder and water under arms. Dust with baking soda." },
      { issue:"Excessive Sweating", herbs:["Sage tea","Alum"], process:"Drink sage tea daily. Apply natural alum powder to underarms." }
    ];

    const container = document.getElementById('remedyList');
    const searchInput = document.getElementById('searchInput');
    const noResultsDiv = document.getElementById('noResults');

    function renderRemedies(filter = '') {
      const filtered = remedies.filter(r => {
        const combined = (r.issue + ' ' + r.herbs.join(' ') + ' ' + r.process).toLowerCase();
        return combined.includes(filter.toLowerCase());
      });

      container.innerHTML = '';
      if (filtered.length === 0) {
        noResultsDiv.style.display = 'block';
      } else {
        noResultsDiv.style.display = 'none';
        filtered.forEach(r => {
          const card = document.createElement('div');
          card.className = 'remedy-card';
          card.innerHTML = `
            <div class="remedy-title">
              <i class="fas fa-mortar-pestle" style="color:#d4a017;"></i> ${r.issue}
            </div>
            <div class="herb-badges">
              ${r.herbs.map(h => `<span class="herb-badge">${h}</span>`).join('')}
            </div>
            <div class="process">${r.process}</div>
          `;
          container.appendChild(card);
        });
      }
    }

    searchInput.addEventListener('input', e => renderRemedies(e.target.value));
    renderRemedies();
  </script>
</body>
</html>
