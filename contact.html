<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Bhishak · Contact Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: #fffef7;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem 1rem 5.5rem;
    }
    .app-container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      border-radius: 2.5rem;
      box-shadow: 0 8px 20px rgba(180,130,20,0.08);
      padding: 1.8rem 1.3rem;
      border: 1px solid #ffe9a7;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      justify-content: center;
    }
    .brand i {
      font-size: 2.4rem;
      color: #d4a017;
      background: #fff6d5;
      padding: 0.5rem;
      border-radius: 50%;
    }
    .brand h1 {
      font-size: 2.3rem;
      font-weight: 700;
      background: linear-gradient(to right, #c99a2b, #b47c2e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card {
      background: #fffef5;
      border-radius: 1.8rem;
      padding: 1.5rem;
      box-shadow: 0 6px 14px rgba(200,150,30,0.07);
      border: 1px solid #fae29c;
      margin-top: 1rem;
    }
    h2 {
      font-size: 1.4rem;
      color: #8b691b;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    p {
      color: #4a3b1f;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid #f0d48a;
      background: #fffef7;
      margin: 0.5rem 0;
      outline: none;
      font-size: 0.95rem;
    }
    textarea {
      border-radius: 1.5rem;
      resize: none;
      min-height: 120px;
    }
    button {
      background: #f7d44a;
      border: none;
      color: #4a3b1f;
      font-weight: 700;
      padding: 0.8rem 1.2rem;
      border-radius: 2.5rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: 0 4px 8px rgba(230,170,20,0.25);
      border: 1px solid #e6b422;
      font-size: 0.95rem;
    }
    button:hover { background: #eebb2e; }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fffef7;
      border-top: 2px solid #fad87a;
      display: flex;
      justify-content: space-around;
      padding: 0.7rem 0.5rem;
      box-shadow: 0 -4px 12px rgba(230,180,20,0.12);
      max-width: 500px;
      margin: 0 auto;
      border-radius: 2rem 2rem 0 0;
      z-index: 10;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.8rem;
      color: #8b7a4c;
      font-weight: 600;
      text-decoration: none;
    }
    .nav-item i {
      font-size: 1.4rem;
      color: #b4943c;
    }
    .nav-item.active {
      color: #b47c2e;
      transform: scale(1.05);
    }
    .status-msg {
      text-align: center;
      margin-top: 0.8rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="brand">
      <i class="fas fa-om"></i>
      <h1>Bhishak</h1>
    </div>

    <div style="margin-bottom:0.5rem;">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:0.4rem;color:#b47c2e;font-size:0.9rem;font-weight:600;text-decoration:none;">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <div class="card">
      <h2><i class="fas fa-envelope" style="color:#d4a017;"></i> Contact Us</h2>
      <p>Have a question, feedback, or need Ayurvedic guidance? We’d love to hear from you.</p>
      
      <input type="text" id="contactName" placeholder="Your name" required>
      <input type="email" id="contactEmail" placeholder="Your email" required>
      <textarea id="contactMessage" placeholder="Write your message here..." required></textarea>
      
      <button id="sendMessageBtn"><i class="fas fa-paper-plane"></i> Send Message</button>
      <div id="contactStatus" class="status-msg"></div>
    </div>

    <div style="text-align:center; margin-top:1rem; font-size:0.85rem; color:#7a5c12;">
      abhinavaryan.netlify.app
      <i class="fas fa-envelope"></i> samirgroup29@gmail.com
    </div>
  </div>

  <!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
  <a class="nav-item" href="remedies.html"><i class="fas fa-leaf"></i><span>Remedies</span></a>
  <a class="nav-item" href="chatbot.html"><i class="fas fa-robot"></i><span>Bhishak AI</span></a>
  <a class="nav-item active" href="contact.html"><i class="fas fa-envelope"></i><span>Contact</span></a>
</nav>

  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzyqlSIfWHi8Ny7gr14ZfeN8BeZJr83HkBQZCU-GuTUrxYAiWzLGrtLODiCqh5c2LU3/exec';

    document.getElementById('sendMessageBtn').addEventListener('click', async () => {
      const name = document.getElementById('contactName').value.trim();
      const email = document.getElementById('contactEmail').value.trim();
      const message = document.getElementById('contactMessage').value.trim();
      const statusDiv = document.getElementById('contactStatus');
      const btn = document.getElementById('sendMessageBtn');

      if (!name || !email || !message) {
        statusDiv.innerHTML = '<span style="color:red;">Please fill all fields.</span>';
        return;
      }

      if (!email.includes('@') || !email.includes('.')) {
        statusDiv.innerHTML = '<span style="color:red;">Enter a valid email.</span>';
        return;
      }

      // Disable button while sending
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      statusDiv.innerHTML = '';

      try {
        await fetch(SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, message })
        });

        // Clear form
        document.getElementById('contactName').value = '';
        document.getElementById('contactEmail').value = '';
        document.getElementById('contactMessage').value = '';

        statusDiv.innerHTML = '<span style="color:green;"><i class="fas fa-check-circle"></i> Message sent! We\'ll get back to you soon.</span>';
      } catch (err) {
        statusDiv.innerHTML = '<span style="color:red;"><i class="fas fa-times-circle"></i> Failed to send. Please try again.</span>';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
      }
    });
  </script>
</body>
</html>
